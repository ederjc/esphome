esphome:
  name: psoc6-radar-acquisition

infineon:
  variant: CY8C624A
  board: cy8ckit_062s2_ai
  framework:
    source:
      type: git
      url: https://github.com/ederjc/zephyr.git
      ref: ifx-psoc6-v4.5.0-core.1
    overlays:
      app: |
        #include <zephyr/dt-bindings/pinctrl/ifx_cat1-pinctrl.h>

        &gpio_prt12 {
          status = "okay";
        };

        &pinctrl {
          radar_mosi: radar_mosi {
            pinmux = <DT_CAT1_PINMUX(12, 0, HSIOM_SEL_ACT_8)>;
            drive-push-pull;
          };
          radar_miso: radar_miso {
            pinmux = <DT_CAT1_PINMUX(12, 1, HSIOM_SEL_ACT_8)>;
            input-enable;
          };
          radar_clk: radar_clk {
            pinmux = <DT_CAT1_PINMUX(12, 2, HSIOM_SEL_ACT_8)>;
            drive-push-pull;
          };
        };

        &scb6 {
          compatible = "infineon,spi";
          status = "okay";
          pinctrl-0 = <&radar_mosi &radar_miso &radar_clk>;
          pinctrl-names = "default";
        };

logger:
  hardware_uart: UART0

# Isolated board bench fixture; overlay is the verified SPI fixture's unchanged binding.
spi:
  id: radar_bus
  interface: scb6
  clk_pin: P12.2
  miso_pin: P12.1
  mosi_pin: P12.0

infineon_bgt60tr13c:
  id: radar
  spi_id: radar_bus
  cs_pin: P12.3
  reset_pin: P11.1
  irq_pin: P11.0
  spi_mode: 0
  data_rate: 1MHz
  update_interval: 1s
  # NON-FUNCTIONAL PLACEHOLDER: structurally valid write words (registers 0x0C..0x0E
  # set to zero) that only exercise validation and codegen.
  # They do NOT configure chirps; flash a list generated by the BGT60 configurator.
  registers:
    - 0x19000000
    - 0x1B000000
    - 0x1D000000
  num_samples_per_chirp: 128
  num_chirps_per_frame: 16
  num_rx_antennas: 1
  fifo_threshold: 2048
  acquisition_mode: triggered
  use_interrupt: true
  timeout: 500ms
  frame_log_interval: 1

sensor:
  - platform: infineon_bgt60tr13c
    infineon_bgt60tr13c_id: radar
    frame_rate:
      name: Radar frame rate
    signal_rms:
      name: Radar signal RMS
    motion_rms:
      name: Radar motion RMS