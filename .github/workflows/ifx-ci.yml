---
name: Infineon fork CI

on:
  pull_request:
    branches: [ifx/dev, "feat/**"]
  push:
    branches: [ifx/dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Fork checks
    if: github.repository == 'ederjc/esphome'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INFINEON_SMOKE_CONFIG: tests/components/infineon/test.zephyr.yaml
      BMM350_SMOKE_CONFIG: ifx/fixtures/bmm350.yaml
      ESPHOME_ZEPHYR_PREFIX: ${{ github.workspace }}/.cache/ifx-zephyr
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check for the Infineon smoke configuration
        id: smoke
        shell: bash
        run: |
          if [[ -f "$INFINEON_SMOKE_CONFIG" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ -f esphome/components/infineon/__init__.py ]]; then
            echo "::error::Missing required Infineon compile fixture: $INFINEON_SMOKE_CONFIG"
            exit 1
          else
            echo "::notice::Skipping compile until the Infineon platform and its fixture land."
          fi
      - name: Require the BMM350 smoke configuration
        shell: bash
        run: test -f "$BMM350_SMOKE_CONFIG"
      - name: Set up Python
        id: python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements_dev.txt
            requirements_test.txt
      - name: Install ESPHome and test dependencies
        run: python -m pip install -e ".[dev,test]"
      - name: Check Python and YAML
        shell: bash
        run: |
          ruff check esphome ifx tests script
          ruff format --check esphome ifx tests script
          yamllint .github/workflows/ifx-ci.yml
          yamllint "$BMM350_SMOKE_CONFIG"
          if [[ -f "$INFINEON_SMOKE_CONFIG" ]]; then
            yamllint "$INFINEON_SMOKE_CONFIG"
          fi
      - name: Run Zephyr and platform unit tests
        shell: bash
        run: |
          tests=(tests/unit_tests/components/zephyr
                 tests/unit_tests/test_platform_hooks.py
                 tests/unit_tests/test_stacktrace.py
                 tests/unit_tests/components/test_bmm350.py)
          if [[ -d tests/unit_tests/components/infineon ]]; then
            tests+=(tests/unit_tests/components/infineon)
          fi
          python -m pytest -q --no-cov "${tests[@]}"
      - name: Run BMM350 C++ behavior tests
        run: python script/cpp_unit_test.py bmm350
      - name: Run portable radar protocol and SPI delegate tests
        run: |
          cmake -S ifx/tests/bgt60tr13c -B build/ifx-radar-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/ifx-radar-tests --parallel 2
          ctest --test-dir build/ifx-radar-tests --output-on-failure
      - name: Restore managed Zephyr workspace and SDK
        if: steps.smoke.outputs.enabled == 'true'
        id: zephyr-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.ESPHOME_ZEPHYR_PREFIX }}
          key: >-
            ifx-zephyr-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{
            hashFiles('esphome/components/zephyr/*.py', 'esphome/components/zephyr/requirements.txt',
                      'esphome/components/infineon/zephyr_variants/**',
                      env.INFINEON_SMOKE_CONFIG, env.BMM350_SMOKE_CONFIG) }}
      - name: Install Zephyr host tools
        if: steps.smoke.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends device-tree-compiler gperf
      - name: Compile Infineon firmware
        if: steps.smoke.outputs.enabled == 'true'
        run: python -m esphome compile "$INFINEON_SMOKE_CONFIG"
      - name: Compile onboard DPS368 fixture
        if: steps.smoke.outputs.enabled == 'true'
        run: |
          yamllint tests/components/infineon/test-dps368.zephyr.yaml
          python -m esphome compile tests/components/infineon/test-dps368.zephyr.yaml
      - name: Compile onboard BMI270 fixture
        if: steps.smoke.outputs.enabled == 'true'
        run: |
          yamllint tests/components/infineon/test-bmi270.zephyr.yaml
          python -m esphome compile tests/components/infineon/test-bmi270.zephyr.yaml
      - name: Compile BMM350 firmware
        run: python -m esphome compile "$BMM350_SMOKE_CONFIG"
      - name: Compile onboard radar SPI identification
        run: python -m esphome compile tests/components/infineon/test-radar-spi.zephyr.yaml
      - name: Compile the BGT60TR13C register diagnostic
        run: python -m esphome compile tests/components/infineon_bgt60tr13c/test-diagnostic.zephyr.yaml
      - name: Compile the PSoC 6 stereo PDM fixture
        shell: bash
        run: |
          ref='refs/tags/ifx-psoc6-v4.5.0-pdm.1^{}'
          resolved=$(git ls-remote --exit-code https://github.com/ederjc/zephyr.git "$ref")
          if [[ "$resolved" != "12c2b1aa0bf8511ff5523e4e651ee3ed63466d06"$'\t'"$ref" ]]; then
            echo "::error::The PDMv1 Zephyr tag no longer points to the reviewed commit."
            exit 1
          fi
          python -m esphome compile ifx/pdm-stereo-ci.yaml
      - name: Compile the PSoC 6 relative sound-level fixture
        run: python -m esphome compile ifx/sound-level-ci.yaml
      - name: Save managed Zephyr workspace and SDK
        if: steps.smoke.outputs.enabled == 'true' && steps.zephyr-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.ESPHOME_ZEPHYR_PREFIX }}
          key: ${{ steps.zephyr-cache.outputs.cache-primary-key }}
